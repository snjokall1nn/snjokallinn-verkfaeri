<!doctype html><html lang="is"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snjókallinn Verkfæri</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#101014;color:#fff}.wrap{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:clamp(32px,8vw,60px);margin:0}.tabs{display:flex;gap:8px;margin:24px 0}.tabs button{padding:12px 14px;border:0;border-radius:12px;font-weight:900}.tabs .active{background:#ffd84f}.panel{background:#1c1c24;border-radius:22px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select,.field textarea{padding:12px;border-radius:12px;border:1px solid #ffffff20;background:#121219;color:#fff;font:inherit}.field textarea{min-height:100px}.btn{margin-top:14px;padding:13px 16px;border:0;border-radius:12px;background:#8f74ff;color:#fff;font-weight:900}.timeline{margin-top:18px;display:grid;gap:10px}.milestone{padding:14px;border-radius:14px;background:#ffffff0b}.calcgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.result{font-size:clamp(28px,7vw,48px);font-weight:1000;letter-spacing:-.04em}.muted{color:#aaa}@media(max-width:640px){.grid,.calcgrid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><h1>SNJÓKALLINN VERKFÆRI</h1><small>Gögnin vistast aðeins í þessu tæki.</small></div><div class="tabs"><button class="active">▦ Project Planner</button><button disabled>≋ Subtitle Maker · seinna</button></div><section class="panel"><h2>VERKEFNIÐ Á RÉTTRI LEIÐ</h2><div class="grid"><label class="field">Heiti verkefnis<input id="name"></label><label class="field">Tegund verkefnis<select id="type"><option>Tónlistarmyndband</option><option>Portrait-myndataka</option><option>Brúðkaup</option><option>Viðburður</option><option>Efni fyrir samfélagsmiðla</option></select></label><label class="field">Töku-/verkefnisdagur<input id="date" type="date"></label><label class="field">Umfang<select id="size"><option>Miðlungs</option><option>Lítið</option><option>Stórt</option></select></label></div><label class="field" style="margin-top:12px">Það sem má alls ekki gleymast<textarea id="notes"></textarea></label><button class="btn" id="plan">BÚA TIL ÁÆTLUN</button><div class="timeline" id="timeline"></div></section><section class="panel"><h2>PROJECT CALCULATOR</h2><div class="calcgrid"><label class="field">Undirbúningur (klst.)<input id="prep" type="number" value="4"></label><label class="field">Tökur (klst.)<input id="shoot" type="number" value="8"></label><label class="field">Eftirvinnsla (klst.)<input id="post" type="number" value="24"></label><label class="field">Samskipti og umsýsla (klst.)<input id="admin" type="number" value="3"></label><label class="field">Innra tímaverð<input id="rate" type="number" value="12000"></label><label class="field">Beinn kostnaður<input id="cost" type="number" value="0"></label><label class="field">Svigrúm / hagnaður<select id="margin"><option value=".15">15%</option><option value=".25" selected>25%</option><option value=".35">35%</option></select></label><label class="field">Álag<select id="surcharge"><option value="0">Ekkert</option><option value=".1">Flýtiverk +10%</option><option value=".2">Kvöld/helgi +20%</option><option value=".3">Mikil áhætta +30%</option></select></label></div><button class="btn" id="calc">REIKNA VERÐ</button><p class="muted">Ráðlagt með VSK</p><div class="result" id="result">—</div></section></div><script>const $=x=>document.getElementById(x);function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x.toLocaleDateString('is-IS')}const templates={'Tónlistarmyndband':[[2,'Tökur komnar í tölvu'],[14,'Rough cut tilbúið'],[21,'Læst klippa'],[28,'Litgreining og textar'],[35,'Myndband tilbúið']],'Portrait-myndataka':[[7,'Myndaval tilbúið'],[21,'Fullunnar myndir afhentar']],'Brúðkaup':[[2,'Sneak peeks'],[42,'Fullt gallerí afhent']],'Viðburður':[[14,'Fullunnar myndir']], 'Efni fyrir samfélagsmiðla':[[7,'Fyrsta afhending']]};$('plan').onclick=()=>{let d=$('date').value;if(!d)return;$('timeline').innerHTML=(templates[$('type').value]||[]).map(([days,label])=>`<div class="milestone"><b>${addDays(d,days)}</b><br>${label}</div>`).join('');localStorage.setItem('snjo-project',JSON.stringify({name:$('name').value,type:$('type').value,date:d,size:$('size').value,notes:$('notes').value}))};$('calc').onclick=()=>{let h=['prep','shoot','post','admin'].reduce((s,id)=>s+Number($(id).value||0),0),base=h*Number($('rate').value||0)+Number($('cost').value||0),m=1+Number($('margin').value),s=1+Number($('surcharge').value),vat=1.24,total=Math.round(base*m*s*vat);$('result').textContent=total.toLocaleString('is-IS')+' kr.'};let saved=JSON.parse(localStorage.getItem('snjo-project')||'null');if(saved){Object.entries(saved).forEach(([k,v])=>{if($(k))$(k).value=v})}</script></body></html>
